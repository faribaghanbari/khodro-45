[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    --html=reports/html-report/index.html
    --self-contained-html
    --junitxml=reports/junit/results.xml
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    forms: Forms section tests
    bookstore: Book Store login tests
    tables: Web Tables CRUD tests
    xdist_group(name): Group tests to avoid parallel execution conflicts
timeout = 300
timeout_method = thread

[playwright]
base_url = https://demoqa.com

